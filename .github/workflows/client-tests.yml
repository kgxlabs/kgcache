name: Client CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-client:
    name: Go client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false

      - name: Prepare and validate locked dependencies
        run: make deps-go

      - name: List Go profiles
        run: go run tests/integration/clients/go/run.go list

      - name: Check Go client project code
        run: make check-go

      - name: Run Go bootstrap placeholder
        run: go run tests/integration/clients/go/run.go test --profile go-redis-v9.22.0

  node-client:
    name: Node client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node and bundled npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Prepare and validate locked dependencies
        run: make deps-node

      - name: List Node profiles
        run: node --experimental-strip-types tests/integration/clients/node/run.ts list

      - name: Check Node client project code
        run: make check-node

      - name: Run Node bootstrap placeholder
        run: node --experimental-strip-types tests/integration/clients/node/run.ts test --profile node-redis-6.2.1
