name: go-redis and node-redis tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go-redis:
    name: go-redis ${{ matrix.version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: go-redis-v9.22.0
            version: v9.22.0
            go: '1.26.9'
            lock: tests/integration/clients/go/go-redis/v9/go.sum
          - profile: go-redis-v9.23.0
            version: v9.23.0
            go: '1.26.9'
            lock: tests/integration/clients/go/go-redis/v9/profiles/go-redis-v9.23.0/go.sum
    env:
      CLIENT_PROFILE: ${{ matrix.profile }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      KGCACHE_TEST_ARTIFACT_DIR: test-artifacts/${{ matrix.profile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prepare and validate go-redis dependencies
        run: make deps-go

      - name: List go-redis profile
        run: go run tests/integration/clients/go/run.go list --profile "$CLIENT_PROFILE"

      - name: Check go-redis test code
        run: make check-go

      - name: Run go-redis compatibility cases against this checkout
        run: make test-go CLIENT_PROFILE="$CLIENT_PROFILE"

      - name: Upload go-redis failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.profile }}-failures
          path: test-artifacts/${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 7

  node-redis:
    name: node-redis ${{ matrix.version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: node-redis-6.2.1
            version: 6.2.1
            node: '22.14.0'
            npm: '10.9.2'
            lock: tests/integration/clients/node/node-redis/v6/package-lock.json
          - profile: node-redis-6.2.0
            version: 6.2.0
            node: '22.14.0'
            npm: '10.9.2'
            lock: tests/integration/clients/node/node-redis/v6/profiles/node-redis-6.2.0/package-lock.json
    env:
      CLIENT_PROFILE: ${{ matrix.profile }}
      NPM_VERSION: ${{ matrix.npm }}
      KGCACHE_TEST_ARTIFACT_DIR: test-artifacts/${{ matrix.profile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node and bundled npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            tests/integration/clients/node/package-lock.json
            ${{ matrix.lock }}

      - name: Verify bundled npm
        run: test "$(npm --version)" = "$NPM_VERSION"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prepare and validate node-redis dependencies
        run: make deps-node

      - name: List node-redis profile
        run: node --experimental-strip-types tests/integration/clients/node/run.ts list --profile "$CLIENT_PROFILE"

      - name: Check node-redis test code
        run: make check-node

      - name: Run node-redis compatibility cases against this checkout
        run: make test-node CLIENT_PROFILE="$CLIENT_PROFILE"

      - name: Upload node-redis failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.profile }}-failures
          path: test-artifacts/${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 7
