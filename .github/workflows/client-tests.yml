name: go-redis and node-redis tests

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Optional exact source commit; omit for the caller checkout'
        required: false
        default: ''
        type: string
      version:
        description: 'Optional effective SemVer for client-test builds'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  profiles:
    name: Select client profiles from the tested source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.profiles.outputs.source_sha }}
      go: ${{ steps.profiles.outputs.go }}
      node: ${{ steps.profiles.outputs.node }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Resolve required profiles and dependency locks
        id: profiles
        env:
          SELECTED_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source_sha=$(git rev-parse HEAD)
          [[ -z "$SELECTED_SHA" || "$SELECTED_SHA" == "$source_sha" ]]
          if [[ -n "$RELEASE_VERSION" ]]; then
            jq -en -L tools/release --arg version "$RELEASE_VERSION" \
              'include "semver"; $version | semver'
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          for language in go node; do
            matrix=$(jq -ce --arg language "$language" '
              . as $matrix | {include: [.profiles[] | select(.ci == "required") |
                . as $profile | $matrix.suites[] |
                select(.id == $profile.suiteId and .language == $language) |
                {profile: $profile.id, version: $profile.clientVersion,
                  go: $profile.runtimeVersion, node: $profile.runtimeVersion,
                  npm: $profile.packageManagerVersion,
                  lock: ("tests/integration/clients/" + $profile.dependencyDir +
                    (if $language == "go" then "/go.sum" else "/package-lock.json" end))}]} |
              if (.include | length) > 0 then . else error("missing required profiles") end' \
              tests/integration/clients/matrix.json)
            printf '%s=%s\n' "$language" "$matrix" >> "$GITHUB_OUTPUT"
          done

  go-redis:
    needs: profiles
    name: go-redis ${{ matrix.version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.go) }}
    env:
      CLIENT_PROFILE: ${{ matrix.profile }}
      RELEASE_VERSION: ${{ inputs.version }}
      KGCACHE_BIN: ${{ github.workspace }}/zig-out/bin/kgcache
      GOTOOLCHAIN: local
      GOWORK: 'off'
      KGCACHE_TEST_ARTIFACT_DIR: test-artifacts/${{ matrix.profile }}

    steps:
      - name: Check out the resolved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.profiles.outputs.source_sha }}
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prepare and validate go-redis dependencies
        run: make deps-go

      - name: List go-redis profile
        run: go run tests/integration/clients/go/run.go list --profile "$CLIENT_PROFILE"

      - name: Check go-redis test code
        run: make check-go

      - name: Run go-redis compatibility cases against this checkout
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            zig build -Doptimize=ReleaseSafe "-Dversion=$RELEASE_VERSION"
            go run tests/integration/clients/go/run.go test --profile "$CLIENT_PROFILE"
          else
            make test-go CLIENT_PROFILE="$CLIENT_PROFILE"
          fi

      - name: Upload go-redis failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.profile }}-failures
          path: test-artifacts/${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 7

  node-redis:
    needs: profiles
    name: node-redis ${{ matrix.version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.node) }}
    env:
      CLIENT_PROFILE: ${{ matrix.profile }}
      RELEASE_VERSION: ${{ inputs.version }}
      KGCACHE_BIN: ${{ github.workspace }}/zig-out/bin/kgcache
      NPM_VERSION: ${{ matrix.npm }}
      KGCACHE_TEST_ARTIFACT_DIR: test-artifacts/${{ matrix.profile }}

    steps:
      - name: Check out the resolved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.profiles.outputs.source_sha }}
          persist-credentials: false

      - name: Install pinned Node and bundled npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            tests/integration/clients/node/package-lock.json
            ${{ matrix.lock }}

      - name: Verify bundled npm
        run: test "$(npm --version)" = "$NPM_VERSION"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prepare and validate node-redis dependencies
        run: make deps-node

      - name: List node-redis profile
        run: node --experimental-strip-types tests/integration/clients/node/run.ts list --profile "$CLIENT_PROFILE"

      - name: Check node-redis test code
        run: make check-node

      - name: Run node-redis compatibility cases against this checkout
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            zig build -Doptimize=ReleaseSafe "-Dversion=$RELEASE_VERSION"
            node --experimental-strip-types tests/integration/clients/node/run.ts \
              test --profile "$CLIENT_PROFILE"
          else
            make test-node CLIENT_PROFILE="$CLIENT_PROFILE"
          fi

      - name: Upload node-redis failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.profile }}-failures
          path: test-artifacts/${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 7
