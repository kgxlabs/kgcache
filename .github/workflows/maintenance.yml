name: Maintenance compatibility

on:
  pull_request:
    branches:
      - 'release/**'
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  maintenance:
    name: Maintenance compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out trusted base tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Fetch the exact PR head and complete history as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr-source
          persist-credentials: false

      - name: Check the requested release version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -e --arg repository "$REPOSITORY" \
            '.pull_request.head.repo.full_name == $repository' "$GITHUB_EVENT_PATH"
          version=$(jq -er -L base/tools/release \
            'include "release-pr"; .pull_request.base.ref | release_version' "$GITHUB_EVENT_PATH")
          if jq -en -L base/tools/release --arg version "$version" \
            'include "release-pr"; $version | rc_series' > /dev/null; then
            printf 'The next RC number is reserved after merge.\n'
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 45 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$RUNNER_TEMP/release-tag.json" --write-out '%{http_code}' \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/v$version")
          [[ "$status" == 404 ]] || {
            printf 'Release version must be unused; tag lookup returned HTTP %s.\n' "$status" >&2
            exit 1
          }

      - name: Check declarations and main-first backport references
        run: bash base/tools/release/check-maintenance.sh --event "$GITHUB_EVENT_PATH" --repo pr-source
