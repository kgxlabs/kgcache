name: Weekly pinned client compatibility

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Weekly Zig checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KGCACHE_TEST_ARTIFACT_DIR: test-artifacts/process

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check Zig formatting
        run: zig fmt --check build.zig build.zig.zon src tests

      - name: Run unit tests
        run: zig build test

      - name: Run process integration tests
        run: zig build test-integration

      - name: Upload process test failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-process-test-failures
          path: test-artifacts/process
          if-no-files-found: ignore
          retention-days: 7

  client-tests:
    name: Weekly pinned clients
    needs: tests
    uses: ./.github/workflows/client-tests.yml
    with:
      source_sha: ${{ github.sha }}
