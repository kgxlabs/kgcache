name: Registry image verification

on:
  push:
    branches:
      - 'ci/registry-check/*'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Optional preview run for image verification, already uploaded as ci-RUN_ID to the testing repository'
        required: false
        type: string
      credential_repository:
        description: 'Check pull/push permission without uploading any image'
        required: true
        default: testing
        type: choice
        options:
          - testing
          - production

# The image job is read-only. Only manual runs on main can check credentials.
permissions:
  contents: read
  actions: read

jobs:
  credentials:
    name: Verify publisher credentials without publishing
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out protected main configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Node for the credential check
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/integration/clients/node/node-redis/v6/.node-version
          package-manager-cache: false

      - name: Authenticate the repository-scoped publisher App
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-administration: write
          permission-actions: read

      - name: Check the configured App and protected version tags
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$REPOSITORY" == kgxlabs/kgcache ]]
          jq -e --arg app "$APP_ID" '.publisher_app_id == ($app | tonumber)' \
            .github/release-automation.json
          ruleset=$(jq -r .tag_ruleset_id .github/release-automation.json)
          [[ "$ruleset" =~ ^[1-9][0-9]*$ ]]
          curl --fail --silent --show-error --max-time 45 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/rulesets/$ruleset" \
            > "$RUNNER_TEMP/tag-rules.json"
          jq -e -L tools/release --argjson app "$APP_ID" \
            'include "publication"; validate_tag_rules($app) | true' "$RUNNER_TEMP/tag-rules.json"
          printf 'Publisher App authenticated and version-tag rules verified.\n\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Docker Hub grants without pushing
        env:
          TARGET: ${{ inputs.credential_repository }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('.github/release-automation.json', 'utf8'));
          const target = process.env.TARGET;
          if (!['testing', 'production'].includes(target)) throw new Error('Invalid credential target.');
          const registry = target === 'testing' ? config.rehearsal_registry_repository : config.registry_repository;
          if (!/^docker\.io\/kgxlabs\/[a-z0-9_-]+$/.test(registry)) throw new Error('Invalid owned registry.');
          const username = process.env.DOCKERHUB_USERNAME;
          const password = process.env.DOCKERHUB_TOKEN;
          if (!username || !password) throw new Error('Docker Hub credentials are missing.');
          const repository = registry.slice('docker.io/'.length);
          const url = new URL('https://auth.docker.io/token');
          url.searchParams.set('service', 'registry.docker.io');
          url.searchParams.set('scope', `repository:${repository}:pull,push`);
          const response = await fetch(url, {
            headers: { Authorization: `Basic ${Buffer.from(`${username}:${password}`).toString('base64')}` },
            signal: AbortSignal.timeout(45000),
          });
          if (!response.ok) throw new Error(`Docker Hub authentication failed (${response.status}).`);
          const value = await response.json();
          const token = value.token ?? value.access_token;
          if (typeof token !== 'string' || token.split('.').length !== 3) throw new Error('Invalid registry token.');
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
          const access = claims.access?.find((entry) => entry.type === 'repository' && entry.name === repository);
          if (!['pull', 'push'].every((action) => access?.actions?.includes(action))) {
            throw new Error(`Docker Hub did not grant pull and push access to ${repository}.`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Docker Hub granted pull and push access to \`${registry}\`.\n\n` +
            'No image upload, version allocation, Git tag, or GitHub Release was created.\n');
          console.log(`Verified Docker Hub pull/push grants for ${repository}. No upload performed.`);
          JS

  verify:
    name: Verify testing-registry image on native Linux amd64
    if: github.event_name == 'push' || inputs.candidate_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REGISTRY: docker.io/kgxlabs/kgcachetesting
    steps:
      - name: Identify the successful main preview and its artifacts
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.candidate_run_id }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$REPOSITORY" == kgxlabs/kgcache ]]
          run=$INPUT_RUN
          if [[ -z "$run" ]]; then run=${BRANCH#ci/registry-check/}; fi
          [[ "$run" =~ ^[1-9][0-9]*$ ]]
          api="https://api.github.com/repos/$REPOSITORY/actions/runs/$run"
          curl --fail --silent --show-error --max-time 45 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$api" > "$RUNNER_TEMP/preview-run.json"
          jq -e --arg repository "$REPOSITORY" \
            '.repository.full_name == $repository and .head_repository.full_name == $repository and
              .head_branch == "main" and .event == "workflow_dispatch" and
              .path == ".github/workflows/release.yml" and .conclusion == "success"' \
            "$RUNNER_TEMP/preview-run.json"
          attempt=$(jq -r .run_attempt "$RUNNER_TEMP/preview-run.json")
          curl --fail --silent --show-error --max-time 45 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$api/artifacts?per_page=100" > "$RUNNER_TEMP/preview-artifacts.json"
          jq -e '.total_count < 100' "$RUNNER_TEMP/preview-artifacts.json"
          jq -e --arg suffix "-$run-$attempt" \
            '[.artifacts[] | select(.expired == false and
              (.name | startswith("candidate-preview-") and endswith($suffix)))] |
              if length == 1 then .[0] else error("expected one preview candidate") end' \
            "$RUNNER_TEMP/preview-artifacts.json" > "$RUNNER_TEMP/selected-artifact.json"
          artifact=$(jq -r .id "$RUNNER_TEMP/selected-artifact.json")
          source=$(jq -er '.name | capture("-(?<source>[0-9a-f]{40})-[0-9]+-[0-9]+$") | .source' \
            "$RUNNER_TEMP/selected-artifact.json")
          transfer=$(jq -er --arg name "transfer-$source-$run-$attempt" \
            '[.artifacts[] | select(.expired == false and .name == $name)] |
              if length == 1 then .[0].id else error("expected one transfer receipt") end' \
            "$RUNNER_TEMP/preview-artifacts.json")
          {
            printf 'run=%s\nsource=%s\nartifact=%s\ntransfer=%s\n' \
              "$run" "$source" "$artifact" "$transfer"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact qualified source and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the retained preview
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact }}
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - name: Download its independent transfer receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.transfer }}
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/transfer

      - name: Install the source's pinned Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/integration/clients/go/go-redis/v9/.go-version
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/integration/clients/node/node-redis/v6/.node-version
          package-manager-cache: false

      - name: Pull and qualify the same image without credentials or rebuilding
        env:
          PREVIEW_RUN: ${{ steps.candidate.outputs.run }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source }}
          GOTOOLCHAIN: local
        run: |
          source tools/release/common.sh
          source tools/release/candidate-common.sh
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          jq -e --arg source "$SOURCE_SHA" '.passed == true and .rebuilt == false and
            .publishable == false and .native_import == true and .source_sha == $source and
            .candidate_qualified_amd64 == true' "$RUNNER_TEMP/transfer/import.json"
          expected=$(jq -r .candidate_sha256 "$RUNNER_TEMP/transfer/import.json")
          candidate_snapshot_bundle "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/bundle" "$expected"
          candidate_check_archive "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/archive"
          manifest="$RUNNER_TEMP/bundle/candidate.json"
          jq -e --arg source "$SOURCE_SHA" --arg run "$PREVIEW_RUN" \
            '.source_sha == $source and .run.id == $run and .mode == "preview" and
              .publishable == false and .qualification.qualified_amd64 == true' "$manifest"
          [[ "$(uname -m)" == x86_64 && "$(candidate_engine)" == linux/amd64 ]]
          image=$(jq -r .image.id "$manifest")
          if docker image inspect "$image" > /dev/null 2>&1; then
            release_fail 'candidate image is already present; use a fresh runner'
          fi
          ref="$REGISTRY:ci-$PREVIEW_RUN"
          docker buildx imagetools inspect "$ref" --raw > "$RUNNER_TEMP/registry-manifest.json"
          jq -e --arg image "$image" '.schemaVersion == 2 and .config.digest == $image' \
            "$RUNNER_TEMP/registry-manifest.json"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' |
            jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          docker image pull --platform linux/amd64 "$REGISTRY@$digest"
          [[ "$(docker image inspect "$REGISTRY@$digest" --format '{{.Id}}')" == "$image" ]]
          container="kgcache-registry-check-$GITHUB_RUN_ID"
          trap 'timeout 10s docker rm --force "$container" > /dev/null 2>&1 || true' EXIT
          candidate_inspect_image "$image" "$RUNNER_TEMP/bundle" "$container" "$RUNNER_TEMP/inspected"
          bash tests/container/run.sh --image "$REGISTRY@$digest" \
            --artifacts "$RUNNER_TEMP/registry-check/service"
          set -- "$RUNNER_TEMP"/registry-check/service/run.*/result.json
          [[ $# == 1 && -f "$1" ]]
          jq -e --arg image "$image" '.passed == true and .qualified_amd64 == true and
            .compose.passed == true and .image_id == $image' "$1"
          jq -n --arg run "$PREVIEW_RUN" --arg source "$SOURCE_SHA" --arg image "$image" \
            --arg digest "$digest" --arg registry "$REGISTRY" --arg manifest "$expected" \
            '{passed:true, publishable:false, rebuilt:false, native_amd64:true,
              candidate_run_id:$run, source_sha:$source, image_id:$image, digest:$digest,
              registry:$registry, candidate_sha256:$manifest}' \
            > "$RUNNER_TEMP/registry-check/result.json"
          jq -r '"### Registry image verification passed", "",
            "Preview run: `\(.candidate_run_id)`", "Source: `\(.source_sha)`",
            "Image: `\(.image_id)`", "Digest: `\(.digest)`", "",
            "Native clean pull and service/client checks passed. No release was published."' \
            "$RUNNER_TEMP/registry-check/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain registry verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-check
          if-no-files-found: ignore
          retention-days: 30

  result:
    name: Verify requested readiness checks completed
    needs: [credentials, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          required=false
          if [[ "$EVENT" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            jq -e '.credentials.result == "success"' <<< "$RESULTS"
            required=true
          fi
          if [[ "$EVENT" == push || -n "$CANDIDATE_RUN" ]]; then
            jq -e '.verify.result == "success"' <<< "$RESULTS"
            required=true
          fi
          [[ "$required" == true ]] || {
            printf 'Select a candidate run, or run credential checks from main.\n' >&2
            exit 1
          }
