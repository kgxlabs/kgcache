name: Build and release validation

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  linux-release:
    name: Native Linux amd64 release on Bookworm
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go for endpoint checks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/integration/clients/go/go-redis/v9/.go-version
          cache-dependency-path: tests/integration/clients/go/go-redis/v9/go.sum

      - name: Install pinned Node and bundled npm for endpoint checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/integration/clients/node/node-redis/v6/.node-version
          package-manager-cache: false
          cache: npm
          cache-dependency-path: tests/integration/clients/node/node-redis/v6/package-lock.json

      - name: Install the host CLI for the guide check
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y redis-tools

      - name: Check native defaults and foreign run guards
        run: |
          compiler=$(bash tools/release/zig.sh --print-path)
          ZIG="$compiler" bash tests/build/run.sh

      - name: Check release failure handling
        run: bash tests/release/failures.sh --docker

      - name: Check release proposal, candidate, and GitHub contracts
        run: |
          bash tests/release/proposals.sh
          bash tests/release/candidates.sh
          bash tests/release/github.sh
          bash tests/release/publication.sh --docker

      - name: Build the Linux release
        run: bash tools/release/build.sh

      - name: Check artifact integrity
        run: bash tests/release/artifact.sh zig-out/release/linux-amd64

      - name: Qualify the exact artifact on Bookworm
        run: bash tests/release/run.sh

      - name: Compile the arm64 candidate
        run: bash tools/release/build.sh --platform linux/arm64

      - name: Check Dockerfile build settings
        run: docker build --check --platform linux/amd64 .

      - name: Build and qualify the documented development service
        run: |
          bash tests/container/run.sh --build --guide --artifacts test-artifacts/container-development
          jq -e '.compose.passed == true and .compose.guide_checked == true and
            .qualified_amd64 == false and .build.source.revision == "unknown" and
            .build.source.dirty == true' test-artifacts/container-development/run.*/result.json

      - name: Build the service image with verified source metadata
        run: |
          source_state=$(git status --porcelain)
          if [[ -n "$source_state" ]]; then
            printf 'Image qualification requires a clean checkout.\n' >&2
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          version=$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p' build.zig.zon)
          build_args=(
            --platform linux/amd64
            --build-arg "SOURCE_REVISION=$revision"
            --build-arg SOURCE_DIRTY=false
            --build-arg "VERSION=$version"
          )
          docker build --check "${build_args[@]}" .
          docker build "${build_args[@]}" --tag kgcache:ci .

      - name: Qualify image storage and PID 1 lifecycle on native amd64
        run: |
          bash tests/container/run.sh --image kgcache:ci --artifacts test-artifacts/container
          revision=$(git rev-parse HEAD)
          jq -e --arg revision "$revision" '.compose.passed == true and
            .compose.guide_checked == false and .qualified_amd64 == true and
            .build.source.revision == $revision' test-artifacts/container/run.*/result.json

      - name: Upload container validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence
          path: |
            test-artifacts/container
            test-artifacts/container-development
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-evidence
          path: test-artifacts/release
          if-no-files-found: ignore
          retention-days: 7
